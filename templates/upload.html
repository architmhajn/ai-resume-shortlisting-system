{% extends "base.html" %}
{% block content %}<div class="container py-5"><div class="row g-4"><div class="col-lg-8"><div class="card shadow-sm"><div class="card-body p-4"><h2>Recruiter Workspace</h2><p class="text-muted">Upload candidates and rank them against a role.</p><form method="POST" action="/upload" enctype="multipart/form-data"><label class="form-label">Candidate Resume (PDF)</label><input type="file" name="resume" class="form-control mb-3" required><label class="form-label">Job Description</label><textarea name="job_description" class="form-control" rows="7" required></textarea><button class="btn btn-primary mt-3">Analyze Candidate</button></form></div></div></div><div class="col-lg-4"><div class="card shadow-sm"><div class="card-body"><h5>Workflow</h5><ol class="small text-muted"><li>Upload candidate resumes.</li><li>Paste the target JD.</li><li>Rank all candidates.</li><li>Open a candidate for evidence.</li></ol><a href="/dashboard" class="btn btn-outline-primary w-100">Open Dashboard</a></div></div></div></div></div>{% endblock %}
